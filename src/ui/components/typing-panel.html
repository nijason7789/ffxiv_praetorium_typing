<div id="panelStandardTyping" class="space-y-4">
  <!-- Target Sentence Character Display -->
  <div
    class="p-4 sm:p-5 rounded-xl bg-[#07090e]/95 border border-amber-500/30 min-h-[96px] flex flex-col justify-center"
  >
    <div
      id="typingTargetDisplay"
      class="text-lg sm:text-2xl font-serif-tc font-bold leading-relaxed tracking-wider select-none break-words"
    ></div>
  </div>

  <!-- Typing Input Box & Action Controls -->
  <div class="space-y-2">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-end gap-2.5">
      <div class="min-w-0 flex-1">
        <div class="mb-1 flex min-h-6 items-center justify-between gap-2">
          <label for="typingInput" class="text-xs font-semibold text-slate-300">
            輸入台詞
          </label>
          <span
            id="imeStatusBadge"
            class="hidden text-[11px] px-2 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-700"
          >
            選字中...
          </span>
        </div>
        <input
          id="typingInput"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="請在此輸入上方台詞（支援繁中/日文/英文輸入，完成整句自動進入下一句）..."
          class="w-full px-4 py-3 rounded-lg bg-slate-900/95 border-2 border-amber-500/50 focus:border-amber-400 focus:outline-none text-base sm:text-lg text-amber-50 placeholder-slate-500 shadow-inner"
        />
      </div>
      <button
        id="btnAutoFillWord"
        type="button"
        title="卡住時可自動填入下一個詞組"
        class="ff-btn-gold px-4 py-3 rounded-lg text-xs sm:text-sm font-bold shrink-0"
      >
        ⚡ 魔導輔助填詞
      </button>
    </div>

    <!-- Quick Phrase Assist Chips -->
    <div
      id="typingAssistChips"
      class="flex flex-wrap items-center gap-1.5 pt-1"
    >
      <span class="text-[11px] text-slate-400 mr-1">快速詞組點擊輸入：</span>
      <div id="quickPhraseChips" class="flex flex-wrap gap-1.5"></div>
    </div>
  </div>
</div>

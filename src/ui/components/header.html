<header
  class="sticky top-0 z-30 bg-[#0b0d14]/95 backdrop-blur-md border-b border-amber-500/30 px-3 sm:px-6 py-2.5"
>
  <div
    class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2"
  >
    <!-- Brand Title -->
    <div class="flex items-center gap-2.5">
      <div
        class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500/30 to-red-900/50 border border-amber-400/60 flex items-center justify-center shadow-inner"
      >
        <span class="text-amber-300 font-serif-tc font-black text-lg">XIV</span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span
            class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-red-950/90 text-red-300 border border-red-700/50"
            >Lv.50 主線隨堂考</span
          >
          <h1
            class="text-sm sm:text-base font-bold text-amber-100 tracking-wide"
          >
            最終決戰 天幕魔導城：蓋老師打字特訓
          </h1>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">
          The Praetorium Cutscene Typing &amp; Cloze Challenge • 繁中 / 日本語 /
          English 三語支援
        </p>
      </div>
    </div>

    <!-- Mode Switch Tabs & Quick Controls -->
    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
      <button
        id="navModeTyping"
        type="button"
        class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all bg-amber-500/20 text-amber-200 border border-amber-400/60"
      >
        ⌨️ 一般打字
      </button>
      <button
        id="navModeCloze"
        type="button"
        class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all bg-slate-800/80 text-slate-300 border border-slate-700 hover:border-amber-500/40"
      >
        🧩 台詞填空
      </button>
      <button
        id="navModeExam"
        type="button"
        class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all bg-slate-800/80 text-slate-300 border border-slate-700 hover:border-amber-500/40"
      >
        🔥 綜合隨堂考
      </button>
      <button
        id="navModeScript"
        type="button"
        class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all bg-slate-800/80 text-slate-300 border border-slate-700 hover:border-amber-500/40"
      >
        📜 演講全文與巨集
      </button>

      <div class="h-4 w-[1px] bg-slate-700 mx-0.5 hidden sm:block"></div>

      <!-- Language Switcher Modal Trigger -->
      <button
        id="btnOpenLangModal"
        type="button"
        title="切換繁體中文 / 日本語 / English 版本"
        class="px-2.5 py-1.5 rounded-md text-xs font-semibold bg-amber-500/20 border border-amber-400/60 text-amber-200 hover:bg-amber-500/30 transition"
      >
        🌐 語言：<span id="currentLangBadge" class="font-bold">繁體中文</span>
      </button>

      <button
        id="btnOpenDifficultyModal"
        type="button"
        title="重新選擇難度並開始新一局"
        class="px-2.5 py-1.5 rounded-md text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:border-amber-400/50"
      >
        ⚔️ 難度：<span id="currentDifficultyBadge" class="text-amber-300"
          >體驗</span
        >
      </button>

      <!-- Term Variant Toggle (艾歐澤亞 / 艾奧傑亞) -->
      <button
        id="btnToggleTerm"
        type="button"
        title="切換繁中譯名習慣（打字時兩種皆可通關）"
        class="px-2.5 py-1.5 rounded-md text-xs font-medium bg-slate-900 border border-slate-700 text-slate-300 hover:border-amber-400/50"
      >
        譯名：<span id="termLabel" class="text-amber-300 font-bold"
          >艾歐澤亞</span
        >
      </button>

      <!-- Sound Toggle -->
      <button
        id="btnToggleSound"
        type="button"
        title="切換打字魔導音效"
        class="px-2.5 py-1.5 rounded-md text-xs font-medium bg-slate-900 border border-slate-700 text-amber-300 hover:border-amber-400/50"
      >
        🔊 音效
      </button>
    </div>
  </div>

  <!-- This audio element persists across questions, modes and language changes. -->
  <audio
    id="bgmAudio"
    data-public-src="audio/BGM_ORCH_570-天幕之下.ogg.mp3"
    preload="auto"
    loop
  ></audio>
  <div
    class="max-w-6xl mx-auto mt-2 pt-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs"
  >
    <div class="flex flex-wrap items-center gap-2 text-amber-200/90">
      <span
        id="bgmStatusDot"
        class="w-2.5 h-2.5 rounded-full bg-amber-400"
        aria-hidden="true"
      ></span>
      <span>🎶 背景音樂：天幕之下</span>
      <button
        id="btnToggleBgm"
        type="button"
        title="播放或暫停背景音樂"
        class="px-2.5 py-1.5 rounded-md text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:border-amber-400/50 transition"
      >
        🎶 BGM：選版本後播放
      </button>
      <span
        id="bgmEngineStatus"
        role="status"
        class="px-2 py-0.5 rounded bg-slate-900 text-slate-300 border border-slate-700 text-[11px]"
        >選擇語言版本後開始播放，可隨時暫停。</span
      >
    </div>
    <label class="flex items-center gap-2 text-slate-300" for="bgmVolume">
      BGM 音量
      <input
        id="bgmVolume"
        type="range"
        min="0"
        max="100"
        step="1"
        value="25"
        class="w-24 accent-amber-400"
      />
      <output
        id="bgmVolumeValue"
        for="bgmVolume"
        class="w-9 text-right text-amber-200"
        >25%</output
      >
    </label>
  </div>
</header>
